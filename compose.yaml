name: jansetu
services:
  identity:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ['start-dev', '--import-realm', '--hostname=http://localhost:8180']
    ports: ['127.0.0.1:8180:8080']
    volumes: ['./infra/identity/jansetu-realm.json:/opt/keycloak/data/import/jansetu-realm.json:ro']
    environment:
      KC_HEALTH_ENABLED: 'true'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; read -r response <&3; [[ $$response == *200* ]]',
        ]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 20
  db:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_USER: jansetu
      POSTGRES_PASSWORD: jansetu-local
      POSTGRES_DB: jansetu
    ports: ['127.0.0.1:5438:5432']
    volumes: ['jansetu-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jansetu -d jansetu']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ['/app/migrate', '-dir', '/app/db/migrations', '-seed', '/app/db/seed/local.sql']
    environment: &backend-env
      JANSETU_AUTH_MODE: oidc
      JANSETU_OIDC_ISSUER: http://localhost:8180/realms/jansetu
      JANSETU_OIDC_CLIENT_ID: jansetu-web
      JANSETU_OIDC_BACKCHANNEL: http://identity:8080
      JANSETU_ENV: local
      JANSETU_DATABASE_URL: postgres://jansetu:jansetu-local@db:5432/jansetu?sslmode=disable
      JANSETU_VAULT_URL: postgres://jansetu:jansetu-local@db:5432/jansetu_vault?sslmode=disable
      JANSETU_HTTP_ADDR: :8080
      JANSETU_WEB_ORIGIN: http://localhost:3100
    depends_on:
      db: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ['/app/public-api']
    environment: *backend-env
    ports: ['127.0.0.1:8081:8080']
    depends_on:
      migrate: { condition: service_completed_successfully }
      identity: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/app/public-api', '-healthcheck']
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ['/app/worker']
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      JANSETU_API_URL: http://api:8080
    ports: ['127.0.0.1:3100:3000']
    depends_on:
      api: { condition: service_healthy }
volumes:
  jansetu-data:
