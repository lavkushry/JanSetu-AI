version: '2'
sql:
  - engine: postgresql
    schema:
      - ../../db/migrations/00001_foundation.sql
      - ../../db/migrations/00002_core_enforcement.sql
      - ../../db/migrations/00003_account_security.sql
      - ../../db/migrations/00004_database_isolation.sql
      - ../../db/migrations/00005_publication_report_scope.sql
      - ../../db/migrations/00006_live_scope.sql
      - ../../db/migrations/00007_alias_grant_expiry.sql
      - ../../db/migrations/00008_private_media.sql
      - ../../db/migrations/00009_media_attachment_scope.sql
      - ../../db/migrations/00010_multipart_uploads.sql
      - ../../db/migrations/00011_profile_discovery.sql
      - ../../db/migrations/00012_comment_pagination.sql
      - ../../db/migrations/00013_in_app_activity.sql
    queries: internal/store/queries.sql
    gen:
      go:
        package: dbgen
        out: internal/store/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
