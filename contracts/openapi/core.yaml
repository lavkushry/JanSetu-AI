                type: string
              role:
                type: string
              name:
                type: string
        synthetic:
          const: true
    Accounts:
      type: object
      required:
        - items
        - synthetic
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - profile
              - role
            properties:
              id:
                type: string
              profile:
                $ref: '#/components/schemas/Profile'
              role:
                type: string
        synthetic:
          const: true
    Capabilities:
      type: object
      required:
        - synthetic
