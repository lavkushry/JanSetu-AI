components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Version:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        description: Quoted positive aggregate version
  responses:
    Problem:
      description: Safe error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Command:
      description: Command applied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Command'
    Post:
      description: Visible post revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Post'
    Feed:
      description: Snapshot feed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Feed'
  schemas:
    Problem:
      type: object
      required:
        - status
        - code
        - title
        - retryable
      properties:
        status:
          type: integer
        code:
          type: string
        title:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
    Command:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
        version:
          type: integer
        caseId:
          type: string
        caseVersion:
          type: integer
        receiptId:
          type: string
        value:
          type: integer
        enabled:
          type: boolean
        following:
          type: boolean
        joined:
          type: boolean
        decision:
          type: string
        signedIn:
          type: boolean
    AuthConfig:
      type: object
      required:
        - mode
        - loginPath
        - synthetic
      properties:
        mode:
          type: string
          enum:
            - oidc
            - demo
        loginPath:
          type: string
        synthetic:
          const: true
    AccountSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - current
        - method
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
        method:
          type: string
          enum:
            - oidc
            - demo
    ProfileInput:
      type: object
      additionalProperties: false
      required:
        - handle
        - displayName
        - bio
      properties:
        handle:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,29}$
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 500
    Profile:
      type: object
      required:
        - id
        - handle
        - displayName
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        bio:
          type: string
        version:
          type: integer
    Agency:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    Me:
      type: object
      required:
        - profile
        - roles
        - agencies
        - synthetic
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        roles:
          type: array
          items:
            type: string
        agencies:
          type: array
          items:
            type: object
            required:
              - agency_id
              - role
              - name
            properties:
              agency_id:
                type: string
              role:
                type: string
              name:
                type: string
        synthetic:
          const: true
    Accounts:
      type: object
      required:
        - items
        - synthetic
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - profile
              - role
            properties:
              id:
                type: string
              profile:
                $ref: '#/components/schemas/Profile'
              role:
                type: string
        synthetic:
          const: true
    Capabilities:
      type: object
      required:
        - synthetic
        - mediaUpload
        - ocr
        - voice
        - protectedIntake
        - uiLanguages
        - textLanguages
        - uploads
        - analysisCapabilities
      properties:
        synthetic:
          const: true
        mediaUpload:
          type: boolean
        ocr:
          type: boolean
        voice:
          type: boolean
        protectedIntake:
          type: boolean
        uiLanguages:
          type: array
          items:
            type: string
        textLanguages:
          type: string
        uploads:
          type: object
          required:
            - mimeTypes
            - maxBytes
            - maxAttachments
            - maxPixels
            - purpose
            - adapter
          properties:
            mimeTypes:
              type: array
              items: *id003
            maxBytes: &id004
              type: integer
            maxAttachments: *id004
            maxPixels: *id004
            purpose:
              const: REPORT
            adapter:
              const: LOCAL_PRIVATE_SINGLE_PART
        analysisCapabilities:
          type: array
          items:
            type: object
            required:
              - kind
              - status
              - languageTags
              - note
            properties:
              kind: *id003
              status:
                type: string
                enum:
                  - EVALUATING
                  - PLANNED
              languageTags:
                type: array
                items: *id003
              note: *id003
    Community:
      type: object
      required:
        - id
        - slug
        - title
        - description
        - languageTag
        - visibility
        - state
        - rules
        - rulesRevision
        - members
        - following
        - membershipState
        - version
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        languageTag:
          type: string
        visibility:
          type: string
        state:
          type: string
        rules:
          type: string
        rulesRevision:
          type: integer
        members:
          type: integer
        following:
          type: boolean
        membershipState:
          type: string
        version:
          type: integer
    Post:
      type: object
      required:
        - id
        - kind
        - state
        - version
        - currentRevision
        - publishedRevision
        - title
        - body
        - languageTag
        - createdAt
        - publishedAt
        - author
        - community
        - media
        - stats
        - viewer
        - candidate
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - SHORT
            - DISCUSSION
            - QUESTION
        state:
          type: string
        version:
          type: integer
        currentRevision:
          type: integer
        publishedRevision:
          type:
            - integer
            - 'null'
        title:
          type:
            - string
            - 'null'
        body:
          type:
            - string
            - 'null'
        languageTag:
          type: string
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type:
            - string
            - 'null'
        author:
          oneOf:
            - $ref: '#/components/schemas/Profile'
            - type: 'null'
        community:
          oneOf:
            - type: object
              required:
                - id
                - slug
                - title
              properties:
                id:
                  type: string
                slug:
                  type: string
                title:
                  type: string
            - type: 'null'
        media:
          type: array
          items:
            type: object
        stats:
          type: object
          required:
            - score
            - comments
            - reposts
            - asOf
          properties:
            score:
              type: integer
            comments:
              type: integer
            reposts:
              type: integer
            asOf:
              type: string
        viewer:
          type: object
          required:
            - vote
            - bookmarked
            - reposted
            - canEdit
            - canDelete
            - canReply
          properties:
            vote:
              type: integer
            bookmarked:
              type: boolean
            reposted:
              type: boolean
            canEdit:
              type: boolean
            canDelete:
              type: boolean
            canReply:
              type: boolean
        candidate:
          oneOf:
            - type: object
              required:
                - title
                - body
                - revision
                - reviewState
              properties:
                title:
                  type:
                    - string
                    - 'null'
                body:
                  type: string
                revision:
                  type: integer
                reviewState:
                  type: string
            - type: 'null'
    PostInput:
      type: object
      required:
        - kind
        - body
        - languageTag
        - mediaIds
        - submitForReview
      properties:
        kind:
          type: string
          enum:
            - SHORT
            - DISCUSSION
            - QUESTION
        communityId:
          type:
            - string
            - 'null'
          format: uuid
        title:
          type:
            - string
            - 'null'
          maxLength: 180
        body:
          type: string
          maxLength: 8000
        languageTag:
          type: string
          maxLength: 40
        mediaIds:
          type: array
          maxItems: 0
          items:
            type: string
        submitForReview:
          const: true
    PostEdit:
      type: object
      required:
        - body
        - languageTag
        - mediaIds
        - submitForReview
      properties:
        title:
          type:
            - string
            - 'null'
        body:
          type: string
          maxLength: 8000
        languageTag:
          type: string
        mediaIds:
          type: array
          maxItems: 0
          items:
            type: string
        submitForReview:
          const: true
    CommentInput:
