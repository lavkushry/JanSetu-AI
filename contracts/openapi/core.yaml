      properties:
        profile:
          $ref: '#/components/schemas/PublicProfile'
        viewer:
          type: object
          required: [self, following, muted]
          properties:
            self:
              type: boolean
            following:
              type: boolean
            muted:
              type: boolean
    ProfilePosts:
