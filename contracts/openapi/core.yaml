openapi: 3.1.0
info:
  title: JanSetu local core API
  version: 0.26.0
  description:
    Synthetic local milestone. Sessions are HttpOnly cookies. Mutations require X-JanSetu-CSRF;
    social/report creations require Idempotency-Key; versioned changes require If-Match. OIDC login uses PKCE and an
    opaque session; fixture shortcuts require explicit demo mode. Real intake and production deployment
    remain disabled.
servers:
  - url: /api
paths:
  /road-guidance:
    get:
      operationId: get_road_guidance
      summary: Official contact entry points for a resident-selected road type
      description: Curated sources only. No road ownership, individual officer, contractor match or external delivery is confirmed.
      parameters:
        - name: roadType
          in: query
          schema:
            $ref: '#/components/schemas/RoadType'
      responses:
        '200':
          description: Guidance, including explicit unavailable results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadGuidance'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/config:
    get:
      operationId: get_auth_config
      responses:
        '200':
          description: Enabled account flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/login:
    get:
      operationId: get_auth_login
      description: Starts a browser-bound OIDC authorization-code flow. Navigate through the BFF.
      parameters:
        - name: returnTo
          in: query
          schema:
            type: string
            maxLength: 1000
            default: /
      responses:
        '302':
          description: Redirect to the configured identity provider; sets HttpOnly login-flow cookie
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/callback:
    get:
      operationId: get_auth_callback
      description:
        Provider callback; one-time state and browser-cookie match, PKCE exchange, ID token
        and nonce validation.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '303':
          description: Return to application with a session or a generic sign-in error
          headers:
            Location:
              schema:
                type: string
  /me/sessions:
    get:
      operationId: get_me_sessions
      responses:
        '200':
          description: Owner's active sessions; no tokens, IP addresses, or provider identity
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSession'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me/sessions/{id}:
    delete:
      operationId: delete_me_session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: Session revoked; clear cookie if current
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me/sessions/revoke-others:
    post:
      operationId: post_me_revoke_other_sessions
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: Other application sessions revoked
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me/profile:
    patch:
      operationId: patch_me_profile
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_me
  /dev/accounts:
    get:
      responses:
        '200':
          description: Synthetic identities (explicit demo mode only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounts'
        '503':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      operationId: get_dev_accounts
  /dev/session:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - principalId
              properties:
                principalId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      operationId: post_dev_session
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /me/logout:
    post:
      responses:
        '204':
          description: Signed out
        '503':
          $ref: '#/components/responses/Problem'
      operationId: post_me_logout
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /capabilities:
    get:
      responses:
        '200':
          description: Enabled capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_capabilities
  /feed:
    get:
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum:
              - HOME
              - FOLLOWING
              - NEARBY
              - UNRESOLVED
              - RESOLVED
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - new
              - top
              - recommended
        - name: communityId
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Feed'
        '410':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_feed
  /search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        '200':
          description: Typed search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_search
  /me/bookmarks:
    get:
      responses:
        '200':
          $ref: '#/components/responses/Feed'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_me_bookmarks
  /communities:
    get:
      responses:
        '200':
          description: Communities
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Community'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_communities
  /communities/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      responses:
        '200':
          description: Community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Community'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_communities_by_id
  /posts:
    post:
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          $ref: '#/components/responses/Post'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: post_posts
  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      responses:
        '200':
          $ref: '#/components/responses/Post'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_posts_by_id
    patch:
      parameters:
        - $ref: '#/components/parameters/Version'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEdit'
      responses:
        '200':
          $ref: '#/components/responses/Post'
        '412':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: patch_posts_by_id
    delete:
      parameters:
        - $ref: '#/components/parameters/Version'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: Tombstone retained
        '412':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: delete_posts_by_id
  /posts/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      description: Chronological live pages of visible comments. Rechecks post access, author state and blocks on every page. Pending comments and edit candidates are owner-only. Deleted comments are body-free placeholders.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1000
      responses:
        '200':
          description: Twenty visible comments per page, with no total-row cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_posts_by_id_comments
    post:
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          $ref: '#/components/responses/Command'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: post_posts_by_id_comments
  /service-reports:
    post:
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '201':
          description: Platform acknowledgement only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAck'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: post_service_reports
  /my-reports:
    get:
      responses:
        '200':
          description: Own report progress
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportProgress'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_my_reports
  /my-reports/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      responses:
        '200':
          description: Owner only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportProgress'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_my_reports_by_id
  /case-receipts/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      responses:
        '200':
          description: Safe public projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_case_receipts_by_id
  /moderation:
    get:
      responses:
        '200':
          description: Reviewer only
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_moderation
  /authority/intake:
    get:
      responses:
        '200':
          description: Coordinator only
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Intake'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_authority_intake
  /authority/agencies:
    get:
      responses:
        '200':
          description: Active synthetic mandates
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agency'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_authority_agencies
  /authority/cases:
    get:
      responses:
        '200':
          description: Scoped staff queue
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffCase'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_authority_cases
  /authority/cases/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      responses:
        '200':
          description: Scoped workflow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_authority_cases_by_id
  /communities/{id}/membership:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInput'
      operationId: put_communities_by_id_membership
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /communities/{id}/follow:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowingInput'
      operationId: put_communities_by_id_follow
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /posts/{id}/selected-response:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      operationId: put_posts_by_id_selected_response
      summary: Choose or clear a helpful response to a published question
      description: Question author or active moderator/owner of the same community. Non-null selection requires commentRevision matching the displayed approved reply; clear omits it or sends null. The choice binds to approved question and comment revisions; it conveys usefulness, never factual verification.
      parameters:
        - $ref: '#/components/parameters/Version'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [commentId, commentRevision]
                  properties:
                    commentId:
                      type: string
                      format: uuid
                    commentRevision:
                      type: integer
                      minimum: 1
                - type: object
                  additionalProperties: false
                  required: [commentId]
                  properties:
                    commentId:
                      type: 'null'
                    commentRevision:
                      type: 'null'
      responses:
        '200':
          description: Current choice and post version; an identical choice at the current version is a no-op
          headers:
            ETag:
              description: Quoted current post version
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [commentId, version]
                properties:
                  commentId:
                    type: [string, 'null']
                    format: uuid
                  version:
                    type: integer
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /posts/{id}/vote:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteInput'
      operationId: put_posts_by_id_vote
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /posts/{id}/bookmark:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagInput'
      operationId: put_posts_by_id_bookmark
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /posts/{id}/repost:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagInput'
      operationId: put_posts_by_id_repost
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: get_public_profile
      description: Chosen public details of an active profile. Either-direction blocks return the same 404 as an unavailable profile. No principal, provider, report or staff-grant data.
      responses:
        '200':
          description: Public profile and current viewer relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /profiles/{id}/posts:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: get_profile_posts
      description: Latest approved published posts only, including on the author's own profile. Twenty per keyset page, with current block/community/publication checks and no private edit candidates. Cursor binds viewer, target and five-minute deadline.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1000
      responses:
        '200':
          description: Authorized published posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePosts'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /content-reports:
    post:
      operationId: create_content_report
      description: Signed-in private report of an available published post/comment revision. Never automatically removes content. Identical retries deduplicate for the lifetime of the reporter/target/revision; ten new reports per hour.
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentReportInput'
      responses:
        '201':
          description: Private report receipt, without a cached source preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReportReceipt'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
