components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Version:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        description: Quoted positive aggregate version
  responses:
    Problem:
      description: Safe error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Command:
      description: Command applied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Command'
    Post:
      description: Visible post revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Post'
    Feed:
      description: Snapshot feed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Feed'
  schemas:
    Problem:
      type: object
      required:
        - status
        - code
        - title
        - retryable
      properties:
        status:
          type: integer
        code:
          type: string
        title:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
    Command:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
        version:
          type: integer
        caseId:
          type: string
        caseVersion:
          type: integer
        receiptId:
          type: string
        value:
          type: integer
        enabled:
          type: boolean
        following:
          type: boolean
        joined:
          type: boolean
        decision:
          type: string
        signedIn:
          type: boolean
    AuthConfig:
      type: object
      required:
        - mode
        - loginPath
        - synthetic
      properties:
        mode:
          type: string
          enum:
            - oidc
            - demo
        loginPath:
          type: string
        synthetic:
          const: true
    AccountSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - current
        - method
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
        method:
          type: string
          enum:
            - oidc
            - demo
    ProfileInput:
      type: object
      additionalProperties: false
      required:
        - handle
        - displayName
        - bio
      properties:
        handle:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,29}$
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 500
    Profile:
      type: object
      required:
        - id
        - handle
        - displayName
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        bio:
          type: string
        version:
          type: integer
    ContentReportReason:
      type: string
      enum: [SPAM, HARASSMENT, HATE, THREATS, PRIVACY, MISINFORMATION, OTHER]
    ContentReportInput:
      type: object
      additionalProperties: false
      required: [targetType, targetId, targetRevision, reasonCode]
      properties:
        targetType:
          type: string
          enum: [POST, COMMENT]
        targetId:
          type: string
          format: uuid
        targetRevision:
          type: integer
          minimum: 1
        reasonCode:
          $ref: '#/components/schemas/ContentReportReason'
        details:
          type: string
          maxLength: 1000
          description: OTHER requires at least five non-whitespace characters.
    ContentReportReceipt:
      type: object
      required:
        [
          id,
          targetType,
          targetId,
          targetRevision,
          reasonCode,
          details,
          state,
          version,
          createdAt,
          decision,
        ]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [POST, COMMENT]
        targetId:
          type: string
          format: uuid
        targetRevision:
          type: integer
          minimum: 1
        reasonCode:
          $ref: '#/components/schemas/ContentReportReason'
        details:
          type: string
        state:
          type: string
          enum: [OPEN, DECIDED]
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        decision:
          oneOf:
            - type: object
              required: [action, reason, decidedAt]
              properties:
                action:
                  type: string
                  enum: [DISMISS, REMOVE]
                reason:
                  type: string
                decidedAt:
                  type: string
                  format: date-time
            - type: 'null'
    ContentReport:
      allOf:
        - $ref: '#/components/schemas/ContentReportReceipt'
        - type: object
          required: [target, targetState]
          properties:
            targetState:
              type: string
              enum: [AVAILABLE, CHANGED, UNAVAILABLE]
            target:
              oneOf:
                - type: object
                  required: [postId, title, body, authorName]
                  properties:
                    postId:
                      type: string
                      format: uuid
                    title:
                      type: [string, 'null']
                    body:
                      type: string
                    authorName:
                      type: string
                - type: 'null'
    ContentReportPage:
      type: object
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentReport'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [inApp, version]
      properties:
        inApp:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
    MuteInput:
      type: object
      additionalProperties: false
      required: [targetType, targetId, active]
      properties:
        targetType:
          type: string
          enum: [PROFILE, COMMUNITY]
        targetId:
          type: string
          format: uuid
        active:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
    MuteState:
      type: object
      additionalProperties: false
      required: [targetType, targetId, active, expiresAt]
      properties:
        targetType:
          type: string
          enum: [PROFILE, COMMUNITY]
        targetId:
          type: string
          format: uuid
        active:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
    Mute:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, target, active, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [PROFILE, COMMUNITY]
        targetId:
          type: string
          format: uuid
        target:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, label, handle]
              properties:
                id:
                  type: string
                  format: uuid
                label:
                  type: string
                handle:
                  type: string
            - type: 'null'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
    MutePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Mute'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    ActivityRead:
      type: object
      additionalProperties: false
      required: [id, readAt]
      properties:
        id:
          type: string
          format: uuid
        readAt:
          type: [string, 'null']
          format: date-time
    Activity:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt, readAt, actor, message, target]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [REPLY, CASE_PROGRESS, MODERATION_DECISION, PUBLICATION_APPROVAL, APPEAL_OUTCOME, CONTENT_REPORT_OUTCOME]
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
        actor:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, displayName, handle]
              properties:
                id:
                  type: string
                  format: uuid
                displayName:
                  type: string
                handle:
                  type: string
            - type: 'null'
        message:
          type: string
        target:
          type: object
          additionalProperties: false
          required: [kind, id, title]
          properties:
            kind:
              type: string
              enum: [POST, RECEIPT, MODERATION_DECISION, APPEAL, CONTENT_REPORT]
              description: MODERATION_DECISION, APPEAL and CONTENT_REPORT identify exact owner-only records opened under /account; POST and RECEIPT retain public source navigation.
            id:
              type: string
              format: uuid
            title:
              type: string
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    ActivitySummary:
      type: object
      additionalProperties: false
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          format: int64
          minimum: 0
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, handle, displayName, bio, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        bio:
          type: string
        joinedAt:
          type: string
          format: date-time
    ProfileDetail:
      type: object
