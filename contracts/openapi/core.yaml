        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /my-reports/{id}/publication-withdrawal-requests:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: request_owned_public_withdrawal
      description: Owner-only fixed-category request against the current publication
        revision. Pauses new publication while reviewed; does not immediately hide existing
        public progress or alter private case work. Stable clientRequestId and command
        key deduplicate lost responses; retries hydrate current outcomes.
      responses:
        '201':
          description: Private sharing review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWithdrawalRequest'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationWithdrawalRequestInput'
  /my-reports/{id}/publication-withdrawal-requests/{requestId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancel_owned_public_withdrawal
      description: Owner-only cancellation. If-Match binds request version. Pending
        cancellation records an immutable marker and advances only request version.
        Repeating a current cancelled version is a no-op. Publisher-decided requests
        cannot be cancelled.
      responses:
        '200':
          description: Private sharing review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWithdrawalRequest'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationWithdrawalCancellation'
  /authority/publication-withdrawal-requests:
    get:
      operationId: get_public_withdrawal_queue
      description: Live publisher-only queue. Up to one hundred oldest pending or newest
        final requests. Minimal safe preview and private review fields; excludes report
        IDs, aliases, principal identities and original statements.
      responses:
        '200':
          description: Private sharing review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/PublicationWithdrawalReview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              - REQUESTED
              - APPROVED
              - DECLINED
              - CANCELLED
            default: REQUESTED
  /authority/publication-withdrawal-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: get_public_withdrawal_review
      description: Live publisher-only current request, public preview and minimal review
        outcome.
      responses:
        '200':
          description: Private sharing review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWithdrawalReview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /authority/publication-withdrawal-requests/{id}/decisions:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: review_public_withdrawal_request
      description: If-Match binds request version; caseVersion and publicationVersion
        bind current case and public preview. Approval atomically withdraws public progress,
        records separate internal/resident reasons, and prevents republication while
        preserving private work and original case age. Decline records a resident-visible
        reason and permits later fresh publication review. Stale request/case returns
        412; stale publication returns 409; cancelled/final requests cannot acquire
        another decision.
      responses:
        '200':
          description: Private sharing review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWithdrawalReview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationWithdrawalDecisionInput'
  /my-reports/{id}/publication-withdrawal-requests/{requestId}/sharing-renewals:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: renew_owned_public_sharing
      description: Verified owner only. If-Match binds the approved withdrawal request
        version; publicationVersion binds the current withdrawn receipt. Explicitly
        allows future sanitized publisher review without changing the original report
        or immediately publishing anything. Only the latest approved withdrawal for
        that report can gain a new permission. Stable clientRequestId and command key
        preserve retries; the response hydrates the current owner record. A later approved
        withdrawal requires fresh permission. A different client ID conflicts while
        permission is active. Original PRIVATE preferences and other source vetoes
        remain effective.
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationSharingRenewalInput'
      responses:
        '201':
          description: Current private owner withdrawal record and sharing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWithdrawalRequest'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /my-reports/{id}/publication-withdrawal-requests/{requestId}/sharing-renewals/{renewalId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: renewalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancel_owned_sharing_renewal
      description: Verified owner only. If-Match binds the renewal version; publicationVersion
        binds current withdrawn progress. Cancels only an active permission for the
        latest approved withdrawal while the receipt stays withdrawn; republication
        requires a new withdrawal request. Advances only renewal version and retains
        provenance. A retry at the current cancelled version is a no-op and cannot cancel
        a newer renewal. Returns the current owner record.
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationSharingRenewalCancellation'
      responses:
        '200':
          description: Current private owner withdrawal record and sharing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWithdrawalRequest'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    CSRF:
      name: X-JanSetu-CSRF
      in: header
      required: true
      schema:
        type: string
        const: '1'
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Version:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        description: Quoted positive aggregate version
  responses:
    Problem:
      description: Safe error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Command:
      description: Command applied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Command'
    Post:
      description: Visible post revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Post'
    Feed:
      description: Snapshot feed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Feed'
  schemas:
    Problem:
      type: object
      required:
        - status
        - code
        - title
        - retryable
      properties:
        status:
          type: integer
        code:
          type: string
        title:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
    Command:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
        version:
          type: integer
        caseId:
          type: string
        caseVersion:
          type: integer
        receiptId:
          type: string
        value:
          type: integer
        enabled:
          type: boolean
        following:
          type: boolean
        joined:
          type: boolean
        decision:
          type: string
        signedIn:
          type: boolean
    AuthConfig:
      type: object
      required:
        - mode
        - loginPath
        - synthetic
      properties:
        mode:
          type: string
          enum:
            - oidc
            - demo
        loginPath:
          type: string
        synthetic:
          const: true
    AccountSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - current
        - method
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
        method:
          type: string
          enum:
            - oidc
            - demo
    ProfileInput:
      type: object
      additionalProperties: false
      required:
        - handle
        - displayName
        - bio
      properties:
        handle:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,29}$
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 500
    Profile:
      type: object
      required:
        - id
        - handle
        - displayName
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        bio:
          type: string
        version:
          type: integer
    ContentReportReason:
      type: string
      enum: [SPAM, HARASSMENT, HATE, THREATS, PRIVACY, MISINFORMATION, OTHER]
    ContentReportInput:
      type: object
      additionalProperties: false
      required: [targetType, targetId, targetRevision, reasonCode]
      properties:
        targetType:
          type: string
          enum: [POST, COMMENT]
        targetId:
          type: string
          format: uuid
        targetRevision:
          type: integer
          minimum: 1
        reasonCode:
          $ref: '#/components/schemas/ContentReportReason'
        details:
          type: string
          maxLength: 1000
          description: OTHER requires at least five non-whitespace characters.
    ContentReportReceipt:
      type: object
      required:
        [
          id,
          targetType,
          targetId,
          targetRevision,
          reasonCode,
          details,
          state,
          version,
          createdAt,
          decision,
        ]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [POST, COMMENT]
        targetId:
          type: string
          format: uuid
        targetRevision:
          type: integer
          minimum: 1
        reasonCode:
          $ref: '#/components/schemas/ContentReportReason'
        details:
          type: string
        state:
          type: string
          enum: [OPEN, DECIDED]
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        decision:
          oneOf:
            - type: object
              required: [action, reason, decidedAt]
              properties:
                action:
                  type: string
                  enum: [DISMISS, REMOVE]
                reason:
                  type: string
                decidedAt:
                  type: string
                  format: date-time
            - type: 'null'
    ContentReport:
      allOf:
        - $ref: '#/components/schemas/ContentReportReceipt'
        - type: object
          required: [target, targetState]
          properties:
            targetState:
              type: string
              enum: [AVAILABLE, CHANGED, UNAVAILABLE]
            target:
              oneOf:
                - type: object
                  required: [postId, title, body, authorName]
                  properties:
                    postId:
                      type: string
                      format: uuid
                    title:
                      type: [string, 'null']
                    body:
                      type: string
                    authorName:
                      type: string
                - type: 'null'
    ContentReportPage:
      type: object
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentReport'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    RecommendationPreferenceInput:
      type: object
      additionalProperties: false
      required: [personalizationEnabled, interests, languages, locality]
      properties:
        personalizationEnabled:
          type: boolean
        interests:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 80
        languages:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        locality:
          type: string
          maxLength: 80
    RecommendationPreference:
      allOf:
        - $ref: '#/components/schemas/RecommendationPreferenceInput'
        - type: object
          required: [generation, version]
          properties:
            generation:
              type: integer
            version:
              type: integer
    RecommendationEvent:
      type: object
      additionalProperties: false
      required: [eventId, exposureId, kind]
      properties:
        eventId:
          type: string
          format: uuid
        exposureId:
          type: string
          format: uuid
        kind:
          enum: [READ, SKIP, MORE, LESS, SATISFIED, DISSATISFIED]
        activeMilliseconds:
          type: integer
          minimum: 0
          maximum: 600000
    RecommendationExplanation:
      type: object
      required: [explanation]
      properties:
        explanation:
          enum: [EXPLICIT_INTEREST, CHOSEN_LOCALITY, FOLLOWING, RECENT_PUBLIC_POST, CIVIC_URGENCY]
        exposureId:
          type: string
          format: uuid
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [inApp, version]
      properties:
        inApp:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
    MuteInput:
      type: object
      additionalProperties: false
      required: [targetType, targetId, active]
      properties:
        targetType:
          type: string
          enum: [PROFILE, COMMUNITY]
        targetId:
          type: string
          format: uuid
        active:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
    MuteState:
      type: object
      additionalProperties: false
      required: [targetType, targetId, active, expiresAt]
      properties:
        targetType:
          type: string
          enum: [PROFILE, COMMUNITY]
        targetId:
          type: string
          format: uuid
        active:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
    Mute:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, target, active, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [PROFILE, COMMUNITY]
        targetId:
          type: string
          format: uuid
        target:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, label, handle]
              properties:
                id:
                  type: string
                  format: uuid
                label:
                  type: string
                handle:
                  type: string
            - type: 'null'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
    MutePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Mute'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    ActivityRead:
      type: object
      additionalProperties: false
      required: [id, readAt]
      properties:
        id:
          type: string
          format: uuid
        readAt:
          type: [string, 'null']
          format: date-time
    Activity:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt, readAt, actor, message, target]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [REPLY, CASE_PROGRESS, MODERATION_DECISION, PUBLICATION_APPROVAL, APPEAL_OUTCOME, CONTENT_REPORT_OUTCOME]
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
        actor:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, displayName, handle]
              properties:
                id:
                  type: string
                  format: uuid
                displayName:
                  type: string
                handle:
                  type: string
            - type: 'null'
        message:
          type: string
        target:
          type: object
          additionalProperties: false
          required: [kind, id, title]
          properties:
            kind:
              type: string
              enum: [POST, RECEIPT, MODERATION_DECISION, APPEAL, CONTENT_REPORT]
              description: MODERATION_DECISION, APPEAL and CONTENT_REPORT identify exact owner-only records opened under /account; POST and RECEIPT retain public source navigation.
            id:
              type: string
              format: uuid
            title:
              type: string
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    ActivitySummary:
      type: object
      additionalProperties: false
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          format: int64
          minimum: 0
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, handle, displayName, bio, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        bio:
          type: string
        joinedAt:
          type: string
          format: date-time
    ProfileDetail:
      type: object
      required: [profile, viewer]
      properties:
        profile:
          $ref: '#/components/schemas/PublicProfile'
        viewer:
          type: object
          required: [self, following, muted]
          properties:
            self:
              type: boolean
            following:
              type: boolean
            muted:
              type: boolean
    ProfilePosts:
      type: object
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    BlockedPerson:
      type: object
      required: [profileId, profile, blockedAt]
      properties:
        profileId:
          type: string
          format: uuid
        profile:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, handle, displayName]
              properties:
                id:
                  type: string
                  format: uuid
                handle:
                  type: string
                displayName:
                  type: string
            - type: 'null'
        blockedAt:
          type: string
          format: date-time
    BlockedPeople:
      type: object
      required: [items, nextCursor, expiresAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlockedPerson'
        nextCursor:
          type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
    Agency:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    Me:
      type: object
      required:
        - profile
        - roles
        - agencies
        - synthetic
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        roles:
          type: array
          items:
            type: string
        agencies:
          type: array
          items:
            type: object
            required:
              - agency_id
              - role
              - name
            properties:
              agency_id:
                type: string
              role:
                type: string
              name:
                type: string
        synthetic:
          const: true
    Accounts:
      type: object
      required:
        - items
        - synthetic
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - profile
              - role
            properties:
              id:
                type: string
              profile:
                $ref: '#/components/schemas/Profile'
              role:
                type: string
        synthetic:
          const: true
    Capabilities:
      type: object
