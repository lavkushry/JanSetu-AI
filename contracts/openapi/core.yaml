        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_communities_by_id
  /posts:
    post:
      parameters:
        - $ref: '#/components/parameters/Idempotency'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          $ref: '#/components/responses/Post'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: post_posts
  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      responses:
        '200':
          $ref: '#/components/responses/Post'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_posts_by_id
    patch:
      parameters:
        - $ref: '#/components/parameters/Version'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEdit'
      responses:
        '200':
          $ref: '#/components/responses/Post'
        '412':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: patch_posts_by_id
    delete:
      parameters:
        - $ref: '#/components/parameters/Version'
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: Tombstone retained
        '412':
