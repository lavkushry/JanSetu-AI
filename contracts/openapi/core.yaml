          type: string
        postId:
          type: string
        parentId:
          type:
            - string
            - 'null'
        depth:
          type: integer
        state:
          type: string
        version:
          type: integer
        currentRevision:
          type: integer
        publishedVersion:
          type:
            - integer
            - 'null'
        createdAt:
          type: string
        body:
          type:
            - string
            - 'null'
        author:
          oneOf:
            - $ref: '#/components/schemas/Profile'
            - type: 'null'
        viewer:
          type: object
          required:
            - canEdit
            - canDelete
          properties:
            canEdit:
              type: boolean
            canDelete:
              type: boolean
        candidate:
          oneOf:
            - type: object
              required:
                - body
