        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_communities
  /communities/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      responses:
        '200':
          description: Community
          content:
            application/json:
              schema:
