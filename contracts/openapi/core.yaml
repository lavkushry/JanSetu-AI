              - $ref: '#/components/schemas/OCRRegion'
              - $ref: '#/components/schemas/DetectionRegion'
          maxItems: 500
        codes:
          type: array
          items: *id003
        empty:
          type: boolean
    AnalysisTask:
      type: object
      required:
        - id
        - kind
        - state
        - result
        - errorCode
        - retryable
      properties:
        id: *id002
        kind: &id006
          type: string
          enum:
            - QUALITY
            - OCR
            - ISSUE_DETECTION
            - REDACTION
            - VOICE_TRANSCRIPTION
        state:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - UNSUPPORTED
            - CANCELLED
        result:
          oneOf:
            - $ref: '#/components/schemas/ImageAnalysisResult'
            - type: 'null'
        errorCode: *id005
        retryable:
          type: boolean
    Analysis:
      type: object
      required:
        - id
        - mediaId
        - state
        - version
        - tasks
      properties:
        id: *id002
        mediaId: *id002
        state:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - PARTIAL
            - FAILED
            - CANCELLED
        version: *id004
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisTask'
    AnalysisInput:
      type: object
      required:
        - tasks
        - languageTag
      properties:
        tasks:
          type: array
          items: *id006
          maxItems: 5
        languageTag: *id003
    OCRCorrection:
      type: object
      required:
        - taskId
        - regionId
        - originalText
        - correctedText
        - appliedAt
      properties:
        taskId: *id002
        regionId: *id003
        originalText:
          type: string
          maxLength: 500
        correctedText:
          type: string
          maxLength: 500
        appliedAt:
          type: string
          format: date-time

    AppealSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - OPEN
          - REVIEWING
          - UPHELD
          - REVERSED
          - WITHDRAWN
    AppealOutcome:
      type: object
      additionalProperties: false
      required:
      - result
      - reason
      - restorationState
      - restorationReason
      - decidedAt
      properties:
        result:
          type: string
          enum:
          - UPHELD
          - REVERSED
        reason:
          type: string
        restorationState:
          type: string
          enum:
          - UNCHANGED
          - RESTORED
          - NOT_RESTORED
        restorationReason:
          type: string
          enum:
          - NONE
          - TARGET_CHANGED
          - TARGET_UNAVAILABLE
          - POSTING_NOT_ALLOWED
          - PARENT_UNAVAILABLE
        decidedAt:
          type: string
          format: date-time
    AppealReceipt:
      type: object
      additionalProperties: false
      required:
      - id
      - decisionId
      - grounds
      - state
      - version
      - createdAt
      - outcome
      properties:
        id:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        grounds:
          type: string
          minLength: 5
          maxLength: 1000
        state:
          type: string
          enum:
          - OPEN
          - REVIEWING
          - UPHELD
          - REVERSED
          - WITHDRAWN
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        outcome:
          oneOf:
          - $ref: '#/components/schemas/AppealOutcome'
          - type: 'null'
    AppealReview:
      type: object
      additionalProperties: false
      required:
      - id
      - decisionId
      - grounds
      - state
      - version
      - createdAt
      - outcome
      - original
      - targetVersion
      - restorationReason
      - assignedToMe
      - preview
      properties:
        id:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        grounds:
          type: string
          minLength: 5
          maxLength: 1000
        state:
          type: string
          enum:
          - OPEN
          - REVIEWING
          - UPHELD
          - REVERSED
          - WITHDRAWN
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        outcome:
          oneOf:
          - $ref: '#/components/schemas/AppealOutcome'
          - type: 'null'
        original:
          type: object
          additionalProperties: false
          required:
          - action
          - ruleVersion
          - internalReason
          - target
          properties:
            action:
              type: string
              enum:
              - RESTRICT
              - REMOVE
            ruleVersion:
              type: string
            internalReason:
              type: string
              description: Staff-only original note; never included in an owner receipt.
            target:
              type: object
              additionalProperties: false
              required:
              - type
              - id
              - postId
              - revision
              properties:
                type:
                  type: string
                  enum:
                  - POST
                  - COMMENT
                id:
                  type: string
                  format: uuid
                postId:
                  type: string
                  format: uuid
                revision:
                  type: integer
                  minimum: 1
        targetVersion:
          type: integer
          minimum: 0
          description: Current source aggregate version; zero if the original revision is unavailable.
        restorationReason:
          type: string
          enum:
          - NONE
          - TARGET_CHANGED
          - TARGET_UNAVAILABLE
          - POSTING_NOT_ALLOWED
          - PARENT_UNAVAILABLE
        assignedToMe:
          type: boolean
        preview:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - title
            - body
            properties:
              title:
                type: string
              body:
                type: string
          - type: 'null'
    AppealInput:
      type: object
      additionalProperties: false
      required:
      - grounds
      properties:
        grounds:
          type: string
          minLength: 5
          maxLength: 1000
    AppealDecisionInput:
      type: object
      additionalProperties: false
      required:
      - result
      - authorReason
      - targetRevision
      - targetVersion
      properties:
        result:
          type: string
          enum:
          - UPHELD
          - REVERSED
        authorReason:
          type: string
          minLength: 5
          maxLength: 1000
        targetRevision:
          type: integer
          minimum: 1
        targetVersion:
          type: integer
          minimum: 0
    AppealPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      - expiresAt
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AppealReceipt'
        nextCursor:
          type:
          - string
          - 'null'
        expiresAt:
          type: string
          format: date-time
    AppealReviewPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      - expiresAt
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AppealReview'
        nextCursor:
          type:
          - string
          - 'null'
        expiresAt:
          type: string
          format: date-time
