        - summary
        - area
        - state
        - urgencyTier
        - firstReportedAt
        - updatedAt
        - nextUpdateDueAt
        - responsibilities
        - version
        - following
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        area:
          type: string
        state:
          type: string
        urgencyTier:
          type: integer
        firstReportedAt:
          type: string
        updatedAt:
          type: string
        nextUpdateDueAt:
          type:
            - string
            - 'null'
        responsibilities:
