openapi: 3.1.0
info:
  title: JanSetu local core API
  version: 0.3.0
  description:
    Synthetic local milestone. Sessions are HttpOnly cookies. Mutations require X-JanSetu-CSRF;
    social/report creations require Idempotency-Key; versioned changes require If-Match. OIDC login uses PKCE and an
    opaque session; fixture shortcuts require explicit demo mode. Real intake and production deployment
    remain disabled.
servers:
  - url: /api
paths:
  /auth/config:
    get:
      operationId: get_auth_config
      responses:
        '200':
          description: Enabled account flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/login:
    get:
      operationId: get_auth_login
      description: Starts a browser-bound OIDC authorization-code flow. Navigate through the BFF.
      parameters:
        - name: returnTo
          in: query
          schema:
            type: string
            maxLength: 1000
            default: /
      responses:
        '302':
          description: Redirect to the configured identity provider; sets HttpOnly login-flow cookie
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/callback:
    get:
      operationId: get_auth_callback
      description:
        Provider callback; one-time state and browser-cookie match, PKCE exchange, ID token
        and nonce validation.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '303':
          description: Return to application with a session or a generic sign-in error
          headers:
            Location:
              schema:
                type: string
  /me/sessions:
    get:
      operationId: get_me_sessions
      responses:
        '200':
          description: Owner's active sessions; no tokens, IP addresses, or provider identity
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSession'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me/sessions/{id}:
    delete:
      operationId: delete_me_session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: Session revoked; clear cookie if current
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me/sessions/revoke-others:
    post:
      operationId: post_me_revoke_other_sessions
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: Other application sessions revoked
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me/profile:
    patch:
      operationId: patch_me_profile
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_me
  /dev/accounts:
    get:
      responses:
        '200':
          description: Synthetic identities (explicit demo mode only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounts'
        '503':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      operationId: get_dev_accounts
  /dev/session:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - principalId
              properties:
                principalId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Command'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      operationId: post_dev_session
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /me/logout:
    post:
      responses:
        '204':
          description: Signed out
        '503':
          $ref: '#/components/responses/Problem'
      operationId: post_me_logout
      parameters:
        - name: X-JanSetu-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
  /capabilities:
    get:
      responses:
        '200':
          description: Enabled capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_capabilities
  /feed:
    get:
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum:
              - HOME
              - FOLLOWING
              - NEARBY
              - UNRESOLVED
              - RESOLVED
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - new
              - top
        - name: communityId
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Feed'
        '410':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_feed
  /search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        '200':
          description: Typed search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_search
  /me/bookmarks:
    get:
      responses:
        '200':
          $ref: '#/components/responses/Feed'
        '503':
          $ref: '#/components/responses/Problem'
      operationId: get_me_bookmarks
  /communities:
    get:
      responses:
        '200':
          description: Communities
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
