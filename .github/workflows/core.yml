name: Runnable core
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JANSETU_VISION_BINARY: ${{ github.workspace }}/services/vision/run
      JANSETU_POTHOLE_BINARY: ${{ github.workspace }}/services/vision/pothole-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: services/backend/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy && rustup default 1.98.0
      - run: npm ci
      - run: make db
      - run: make identity
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng protobuf-compiler
      - run: make pothole-setup
      - run: make vision-test
      - run: make seed
      - run: make check
      - run: make recommendation-transport-proof
      - name: Start Rust ranker for wire integration
        run: |
          cargo run --locked --manifest-path services/recommendation/Cargo.toml --bin jansetu-recommendation > /tmp/jansetu-recommendation.log 2>&1 &
          ranker_pid=$!
          for attempt in $(seq 1 40); do
            if ! kill -0 "$ranker_pid" 2>/dev/null; then wait "$ranker_pid"; exit 1; fi
            if python3 -c 'import socket; socket.create_connection(("127.0.0.1", 50051), timeout=1).close()' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: make test-integration
        env:
          JANSETU_RECOMMENDATION_TEST_TARGET: 127.0.0.1:50051
      - run: make recommendation-stream-proof
      - run: make generate
      - run: make recommendation-generate
      - run: git diff --exit-code -- services/backend/internal/store/dbgen services/backend/internal/recommendation/pb apps/web/src/lib/generated.ts
      - run: npx playwright install --with-deps chromium
      - name: Start vault, API, workers, and production web
        run: |
          (cd services/backend && go run ./cmd/vault) > /tmp/jansetu-vault.log 2>&1 &
          (cd services/backend && go run ./cmd/public-api) > /tmp/jansetu-api.log 2>&1 &
          (cd services/backend && go run ./cmd/worker) > /tmp/jansetu-worker.log 2>&1 &
          (cd services/backend && go run ./cmd/media-worker) > /tmp/jansetu-media.log 2>&1 &
          npm run start --workspace @jansetu/web > /tmp/jansetu-web.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/health/ready && curl -fsS http://localhost:3100/api/capabilities; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
      - name: Local service diagnostics
        if: failure()
        run: |
          docker compose logs --tail=40 db identity
          cat /tmp/jansetu-api.log /tmp/jansetu-vault.log /tmp/jansetu-worker.log /tmp/jansetu-media.log /tmp/jansetu-web.log 2>/dev/null || true
